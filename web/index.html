<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BBB ADC Frequency Telemetry</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0b1320; color: #e5edf7; }
    main { width: min(92vw, 480px); padding: 28px; box-sizing: border-box;
           border-radius: 22px; background: #19263a; text-align: center; }
    h1 { margin-top: 0; font-size: 1.35rem; }
    svg { width: 100%; max-width: 390px; height: auto; }
    .readout { font-size: 2.5rem; font-weight: 750; color: #34d399; }
    .secondary { color: #aabbd0; }
    .error { color: #fb7185; }
    #needle {
      transition: transform .25s ease;
      transform-box: view-box;
      transform-origin: 160px 152px;
    }
    .pot-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #111b2b;
      text-align: left;
    }
    .pot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.92rem;
      margin-bottom: 8px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #34d399;
      cursor: pointer;
    }
    .pot-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #334663;
      border-radius: 8px;
      background: #1e2e46;
      color: #e5edf7;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #283d5c; }
  </style>
</head>
<body>
  <main>
    <h1>BeagleBone Black · Frequency</h1>
    <svg viewBox="0 0 320 193" role="img" aria-label="Frequency gauge from 45 to 65 hertz">
      <path d="M40 152 A120 120 0 0 1 280 152" fill="none"
            stroke="#38475c" stroke-width="17" stroke-linecap="round" />
      <line id="needle" x1="160" y1="152" x2="40" y2="152"
            stroke="#34d399" stroke-width="5" stroke-linecap="round" />
      <circle cx="160" cy="152" r="8" fill="#34d399" />
      <text x="25" y="179" fill="white" font-size="13">45</text>
      <text x="152" y="22" fill="white" font-size="13">55</text>
      <text x="275" y="179" fill="white" font-size="13">65</text>
      <text x="160" y="102" fill="white" font-size="17" text-anchor="middle">Hz</text>
    </svg>
    <div id="frequency" class="readout" aria-live="polite">-- Hz</div>
    <p id="adc" class="secondary">ADC0: -- / 4095</p>
    <p id="status" class="secondary">Connecting...</p>

    <section class="pot-box" aria-label="Virtual POT simulator">
      <div class="pot-header">
        <label for="potSlider">Virtual POT (AIN0)</label>
        <span id="potLabel" class="secondary">50.0% · 1.80 V</span>
      </div>
      <input id="potSlider" type="range" min="0" max="4095" value="1024">
      <div class="pot-actions">
        <button type="button" data-adc="1024">50 Hz</button>
        <button type="button" data-adc="2048">55 Hz</button>
        <button type="button" data-adc="3071">60 Hz</button>
        <button type="button" id="potAutoBtn">Auto Wave</button>
      </div>
    </section>
  </main>

  <script>
    const MIN_HZ = 45;
    const MAX_HZ = 65;
    const ADC_MAX = 4095;
    const intervalMilliseconds = 500;

    const needle = document.getElementById('needle');
    const frequency = document.getElementById('frequency');
    const adc = document.getElementById('adc');
    const status = document.getElementById('status');
    const potSlider = document.getElementById('potSlider');
    const potLabel = document.getElementById('potLabel');
    const potAutoBtn = document.getElementById('potAutoBtn');

    let draggingPot = false;
    let sendTimer = null;

    function updateGauge(hz) {
      const normalized = Math.max(0, Math.min(1, (hz - MIN_HZ) / (MAX_HZ - MIN_HZ)));
      needle.style.transform = `rotate(${180 * normalized}deg)`;
    }

    function updatePotLabel(adcRaw) {
      const pct = ((adcRaw / ADC_MAX) * 100).toFixed(1);
      const volts = ((adcRaw / ADC_MAX) * 1.8).toFixed(2);
      potLabel.textContent = `${pct}% · ${volts} V`;
    }

    function applyTelemetry(data) {
      if (!Number.isFinite(data.frequency_hz)) throw new Error('Invalid frequency');
      frequency.textContent = `${data.frequency_hz.toFixed(3)} Hz`;
      adc.textContent = `ADC0: ${data.adc_raw} / 4095`;
      const modeText = data.mode ? ` · ${data.mode}` : '';
      status.textContent = `Live${modeText} · updating every 500 ms`;
      status.className = 'secondary';
      updateGauge(data.frequency_hz);

      if (!draggingPot && Number.isFinite(data.adc_raw)) {
        potSlider.value = data.adc_raw;
        updatePotLabel(data.adc_raw);
      }
    }

    async function setVirtualPot(adcRaw) {
      const res = await fetch('/api/pot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ adc_raw: adcRaw })
      });
      if (res.ok) {
        applyTelemetry(await res.json());
      }
    }

    potSlider.addEventListener('pointerdown', () => { draggingPot = true; });
    window.addEventListener('pointerup', () => { draggingPot = false; });

    potSlider.addEventListener('input', () => {
      const val = Number(potSlider.value);
      updatePotLabel(val);
      clearTimeout(sendTimer);
      sendTimer = setTimeout(() => setVirtualPot(val), 40);
    });

    document.querySelectorAll('button[data-adc]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const val = Number(btn.dataset.adc);
        potSlider.value = val;
        updatePotLabel(val);
        setVirtualPot(val);
      });
    });

    potAutoBtn.addEventListener('click', async () => {
      const res = await fetch('/api/pot/reset', { method: 'POST' });
      if (res.ok) {
        applyTelemetry(await res.json());
      }
    });

    async function poll() {
      try {
        const response = await fetch('/api/frequency', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        applyTelemetry(await response.json());
      } catch (error) {
        frequency.textContent = '-- Hz';
        adc.textContent = 'ADC0: unavailable';
        status.textContent = `Disconnected (${error.message})`;
        status.className = 'error';
      }
      setTimeout(poll, intervalMilliseconds);
    }

    poll();
  </script>
</body>
</html>
